name: Build Combined Release Signed APK (Deterministic)

on:
  workflow_dispatch: # Allows you to manually trigger this build from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout DropSauce (Base Project)
      uses: actions/checkout@v4

    - name: Clone Chika Repository and Isolate Reader Modules
      run: |
        git clone https://github.com chika-src
        
        # 1. Initialize clean local module structure inside your fork
        mkdir -p chika-reader/src/main/java/com/chakra/comicreader/data/archive
        mkdir -p chika-reader/src/main/java/com/chakra/comicreader/detection
        mkdir -p chika-reader/src/main/java/com/chakra/comicreader/ui/reader
        mkdir -p chika-reader/src/main/java/com/chakra/comicreader/ui/theme
        mkdir -p chika-reader/src/main/assets
        mkdir -p chika-reader/src/main/res/font
        
        # 2. Extract AI Panel Tracking Assets & Custom Typography
        cp chika-src/app/src/main/assets/manga_panel_detector_int8.tflite chika-reader/src/main/assets/
        cp chika-src/app/src/main/res/font/*.ttf chika-reader/src/main/res/font/
        
        # 3. Pull App-Level UI Screens & Android ML Drivers
        cp chika-src/app/src/main/java/com/chakra/comicreader/ui/reader/*.kt chika-reader/src/main/java/com/chakra/comicreader/ui/reader/
        cp chika-src/app/src/main/java/com/chakra/comicreader/ui/theme/*.kt chika-reader/src/main/java/com/chakra/comicreader/ui/theme/
        cp chika-src/app/src/main/java/com/chakra/comicreader/detection/*.kt chika-reader/src/main/java/com/chakra/comicreader/detection/
        
        # 4. Pull Common KMP Math & Logic Engines
        cp chika-src/shared/src/commonMain/kotlin/com/chakra/comicreader/detection/*.kt chika-reader/src/main/java/com/chakra/comicreader/detection/
        cp chika-src/shared/src/commonMain/kotlin/com/chakra/comicreader/ui/reader/*.kt chika-reader/src/main/java/com/chakra/comicreader/ui/reader/
        cp chika-src/shared/src/commonMain/kotlin/com/chakra/comicreader/data/archive/ComicArchive.kt chika-reader/src/main/java/com/chakra/comicreader/data/archive/
        cp chika-src/shared/src/commonMain/kotlin/com/chakra/comicreader/data/archive/ComicFormatDetector.kt chika-reader/src/main/java/com/chakra/comicreader/data/archive/

    - name: Inject Chika Reader Activity Wrapper
      run: |
        # Creates a traditional Android Activity entry bridge inside Chika's package space
        cat << 'EOF' > chika-reader/src/main/java/com/chakra/comicreader/ui/reader/ChikaReaderActivity.kt
        package com.chakra.comicreader.ui.reader

        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.lifecycle.viewmodel.compose.viewModel
        import com.chakra.comicreader.ui.theme.ChikaTheme

        class ChikaReaderActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val chapterPath = intent.getStringExtra("CHAPTER_PATH") ?: ""

                setContent {
                    ChikaTheme {
                        val readerViewModel: ReaderViewModel = viewModel()
                        ReaderScreen(
                            viewModel = readerViewModel,
                            initialFilePath = chapterPath,
                            onBackPressed = { finish() }
                        )
                    }
                }
            }
        }
        EOF

    - name: Inject Chika Module into Project Structural Files
      run: |
        # Append the new isolated chika module to the global layout manager
        if [ -f settings.gradle.kts ]; then
          echo 'include(":chika-reader")' >> settings.gradle.kts
        else
          echo "include ':chika-reader'" >> settings.gradle
        fi
        
        # Make DropSauce depend directly on our custom chika viewer module
        if [ -f app/build.gradle.kts ]; then
          sed -i '/dependencies {/a \    implementation(project(":chika-reader"))' app/build.gradle.kts
        else
          sed -i '/dependencies {/a \    implementation project(":chika-reader")' app/build.gradle
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Dynamically Generate Cloud Keystore
      run: |
        # Generates a persistent signature matrix using your private passphrase seed
        keytool -genkey -v \
          -keystore release.keystore \
          -alias dropchika-key \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "${{ secrets.APP_SIGNING_PASSPHRASE }}" \
          -keypass "${{ secrets.APP_SIGNING_PASSPHRASE }}" \
          -dname "CN=DropChika, O=Android, C=US"
          
        # Encode the signature into environment space for the code-signer
        echo "KEYSTORE_BASE64=$(base64 -w 0 release.keystore)" >> $GITHUB_ENV

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Android Release Production APK
      run: ./gradlew :app:assembleRelease

    - name: Sign Android Release APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ env.KEYSTORE_BASE64 }}
        alias: dropchika-key
        keyStorePassword: ${{ secrets.APP_SIGNING_PASSPHRASE }}
        keyPassword: ${{ secrets.APP_SIGNING_PASSPHRASE }}

    - name: Upload Production Updateable APK
      uses: actions/upload-artifact@v4
      with:
        name: Combined-Release-Signed-APK
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        
