name: Build Combined DropSauce & Chika APK

on:
  workflow_dispatch: # Allows you to manually click a button to build the app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout DropSauce (Base Project)
      uses: actions/checkout@v4

    - name: Clone Chika Repository
      run: |
        git clone https://github.com chika-src
        # Copy Chika's viewer layout files directly into DropSauce's source tree
        # Note: Paths below are conceptual and must match actual package structures
        mkdir -p app/src/main/java/com/dropsauce/app/chika
        cp -r chika-src/app/src/main/java/* app/src/main/java/com/dropsauce/app/chika/ || true
        cp -r chika-src/app/src/main/res/* app/src/main/res/ || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Combined-DropSauce-Chika-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
