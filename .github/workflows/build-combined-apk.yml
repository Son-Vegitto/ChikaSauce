name: Build Combined Release Signed APK (Deterministic)

on:
  workflow_dispatch: # Restores the manual "Run workflow" trigger button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout DropSauce (Base Project)
      uses: actions/checkout@v4

    - name: Clone Chika Repository and Extract Core ML Math Modules
      run: |
        git clone https://github.com/batunii/chika chika-src
        
        # 1. Initialize empty isolated module layout
        mkdir -p chika-reader/src/main/java/com/chakra/comicreader/data/archive
        mkdir -p chika-reader/src/main/java/com/chakra/comicreader/detection
        mkdir -p chika-reader/src/main/java/com/chakra/comicreader/ui/reader
        mkdir -p chika-reader/src/main/assets
        
        # 2. Extract AI Panel Tracking Weights File
        cp chika-src/app/src/main/assets/manga_panel_detector_int8.tflite chika-reader/src/main/assets/
        
        # 3. Pull Core Logic, YOLO Math Models, and Viewport Canvas Math Files
        cp chika-src/shared/src/commonMain/kotlin/com/chakra/comicreader/detection/*.kt chika-reader/src/main/java/com/chakra/comicreader/detection/
        cp chika-src/shared/src/commonMain/kotlin/com/chakra/comicreader/ui/reader/CameraTransform.kt chika-reader/src/main/java/com/chakra/comicreader/ui/reader/
        cp chika-src/shared/src/commonMain/kotlin/com/chakra/comicreader/data/archive/ComicArchive.kt chika-reader/src/main/java/com/chakra/comicreader/data/archive/
        cp chika-src/shared/src/commonMain/kotlin/com/chakra/comicreader/data/archive/ComicFormatDetector.kt chika-reader/src/main/java/com/chakra/comicreader/data/archive/
        cp chika-src/shared/src/commonMain/kotlin/com/chakra/comicreader/data/archive/NaturalOrder.kt chika-reader/src/main/java/com/chakra/comicreader/data/archive/
        
        # 4. Pull Android-Specific TensorFlow Driver Wrappers
        cp chika-src/app/src/main/java/com/chakra/comicreader/detection/MlPanelDetector.kt chika-reader/src/main/java/com/chakra/comicreader/detection/
        cp chika-src/app/src/main/java/com/chakra/comicreader/detection/PanelSource.kt chika-reader/src/main/java/com/chakra/comicreader/detection/
        cp chika-src/app/src/main/java/com/chakra/comicreader/data/archive/ComicArchiveFactory.kt chika-reader/src/main/java/com/chakra/comicreader/data/archive/
        cp chika-src/app/src/main/java/com/chakra/comicreader/data/archive/ZipComicArchive.kt chika-reader/src/main/java/com/chakra/comicreader/data/archive/
        cp chika-src/app/src/main/java/com/chakra/comicreader/data/archive/RarComicArchive.kt chika-reader/src/main/java/com/chakra/comicreader/data/archive/

    - name: Create Chika Reader Module Build Configurations
      run: |
        cat << 'EOF' > chika-reader/build.gradle
        plugins {
            id 'com.android.library'
            id 'org.jetbrains.kotlin.plugin.compose'
        }

        android {
            namespace 'com.chakra.comicreader'
            compileSdk 34

            defaultConfig {
                minSdk 26
                consumerProguardFiles "consumer-rules.pro"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            buildFeatures {
                compose true
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            
            // Jetpack Compose Layers
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
            
            // Archive decoders
            implementation 'net.sf.sevenzipjbinding:sevenzipjbinding:16.02-2.01'
            implementation 'net.sf.sevenzipjbinding:sevenzipjbinding-all-platforms:16.02-2.01'
            implementation 'org.apache.commons:commons-compress:1.26.0'
            
            // TensorFlow Lite Machine Learning Packages
            implementation 'org.tensorflow:tensorflow-lite:2.14.0'
            implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
        }
        EOF

    - name: Inject Chika Self-Contained Reader Activity Engine
      run: |
        cat << 'EOF' > chika-reader/src/main/java/com/chakra/comicreader/ui/reader/ChikaReaderActivity.kt
        package com.chakra.comicreader.ui.reader

        import android.graphics.BitmapFactory
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.gestures.detectTapGestures
        import androidx.compose.foundation.layout.fillMaxSize
        import androidx.compose.material3.MaterialTheme
        import androidx.compose.material3.Surface
        import androidx.compose.runtime.*
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.asImageBitmap
        import androidx.compose.ui.graphics.graphicsLayer
        import androidx.compose.ui.input.pointer.pointerInput
        import com.chakra.comicreader.data.archive.ComicArchiveFactory
        import com.chakra.comicreader.detection.MlPanelDetector
        import com.chakra.comicreader.detection.PanelPipeline
        import com.chakra.comicreader.detection.Panel
        import java.io.File
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.withContext

        class ChikaReaderActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val chapterPath = intent.getStringExtra("CHAPTER_PATH") ?: ""

                setContent {
                    MaterialTheme {
                        Surface(modifier = Modifier.fillMaxSize()) {
                            var pages by remember { mutableStateOf<List<String>>(emptyList()) }
                            var currentPageIndex by remember { mutableStateOf(0) }
                            var currentBitmap by remember { mutableStateOf<android.graphics.Bitmap?>(null) }
                            var detectedPanels by remember { mutableStateOf<List<Panel>>(emptyList()) }
                            var currentPanelIndex by remember { mutableStateOf(-1) }
                            
                            val detector = remember { MlPanelDetector(this, "manga_panel_detector_int8.tflite") }

                            LaunchedEffect(chapterPath) {
                                withContext(Dispatchers.IO) {
                                    try {
                                        val archive = ComicArchiveFactory.create(File(chapterPath))
                                        pages = archive.numberOfItems().map { it.toString() }
                                    } catch (e: Exception) {
                                        e.printStackTrace()
                                    }
                                }
                            }

                            LaunchedEffect(currentPageIndex, pages) {
                                if (pages.isNotEmpty()) {
                                    withContext(Dispatchers.IO) {
                                        try {
                                            val archive = ComicArchiveFactory.create(File(chapterPath))
                                            archive.extractSlow(currentPageIndex) { stream ->
                                                val bytes = stream.readBytes()
                                                val bitmap = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                                                currentBitmap = bitmap
                                                
                                                val size = com.chakra.comicreader.detection.Size(bitmap.width, bitmap.height)
                                                val source = com.chakra.comicreader.detection.PanelSource(bitmap)
                                                detectedPanels = PanelPipeline.process(size, detector.detect(source))
                                                currentPanelIndex = -1
                                            }
                                        } catch (e: Exception) {
                                            e.printStackTrace()
                                        }
                                    }
                                }
                            }

                            currentBitmap?.let { bitmap ->
                                val activePanel = if (currentPanelIndex in detectedPanels.indices) detectedPanels[currentPanelIndex] else null
                                
                                Canvas(
                                    modifier = Modifier
                                        .fillMaxSize()
                                        .pointerInput(Unit) {
                                            detectTapGestures(
                                                onTap = {
                                                    if (currentPanelIndex < detectedPanels.lastIndex) {
                                                                                                        if (currentPanelIndex < detectedPanels.lastIndex) {
                                                        currentPanelIndex++
                                                    } else if (currentPageIndex < pages.lastIndex) {
                                                        currentPageIndex++
                                                    } else {
                                                        finish()
                                                    }
                                                },
                                                onLongPress = {
                                                    if (currentPanelIndex > -1) {
                                                        currentPanelIndex--
                                                    } else if (currentPageIndex > 0) {
                                                        currentPageIndex--
                                                    }
                                                }
                                            )
                                        }
                                        .graphicsLayer {
                                            if (activePanel != null) {
                                                val scaleX = size.width / activePanel.rect.width
                                                val scaleY = size.height / activePanel.rect.height
                                                val finalScale = minOf(scaleX, scaleY).coerceAtMost(3.0f)
                                                
                                                this.scaleX = finalScale
                                                this.scaleY = finalScale
                                                this.translationX = -activePanel.rect.centerX * finalScale + size.width / 2
                                                this.translationY = -activePanel.rect.centerY * finalScale + size.height / 2
                                            }
                                        }
                                ) {
                                    drawImage(image = bitmap.asImageBitmap())
                                }
                            }
                        }
                    }
                }
            }
        }
        EOF

    - name: Inject Chika Module and Register Android Manifest
      run: |
        echo "include ':chika-reader'" >> settings.gradle
        sed -i '/dependencies {/a \    implementation project(":chika-reader")' app/build.gradle

        TARGET_MANIFEST="app/src/main/AndroidManifest.xml"
        if [ -f "$TARGET_MANIFEST" ]; then
          CHIKA_ACTIVITY_XML='        <activity android:name="com.chakra.comicreader.ui.reader.ChikaReaderActivity" android:exported="false" android:theme="@style/Theme.AppCompat.NoActionBar" />\n    </application>'
          sed -i "s|</application>|$CHIKA_ACTIVITY_XML|g" "$TARGET_MANIFEST"
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Dynamically Generate Cloud Keystore
      run: |
        keytool -genkey -v \
          -keystore release.keystore \
          -alias dropchika-key \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "${{ secrets.APP_SIGNING_PASSPHRASE }}" \
          -keypass "${{ secrets.APP_SIGNING_PASSPHRASE }}" \
          -dname "CN=DropChika, O=Android, C=US"
          
        echo "KEYSTORE_BASE64=$(base64 -w 0 release.keystore)" >> $GITHUB_ENV

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Android Release Production APK
      run: ./gradlew :app:assembleRelease

    - name: Sign Android Release APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ env.KEYSTORE_BASE64 }}
        alias: dropchika-key
        keyStorePassword: ${{ secrets.APP_SIGNING_PASSPHRASE }}
        keyPassword: ${{ secrets.APP_SIGNING_PASSPHRASE }}

    - name: Upload Production Updateable APK
      uses: actions/upload-artifact@v4
      with:
        name: Combined-Release-Signed-APK
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        
