name: Build Combined Release Signed APK (Deterministic)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout DropSauce (Base Project)
      uses: actions/checkout@v4

    - name: Clone Chika Repository and Isolate Reader Modules
      run: |
        git clone https://github.com/batunii/chika chika-src
        
        # 1. Initialize complete module directory layout
        mkdir -p chika-reader/src/main/java/com/chakra/comicreader
        mkdir -p chika-reader/src/main/assets
        mkdir -p chika-reader/src/main/res
        
        # 2. Extract AI Panel Tracking Assets & Custom Typography
        cp chika-src/app/src/main/assets/manga_panel_detector_int8.tflite chika-reader/src/main/assets/
        cp -r chika-src/app/src/main/res/* chika-reader/src/main/res/ || true
        
        # 3. Pull ALL Chika App Source Files recursively to avoid missing references
        cp -r chika-src/app/src/main/java/com/chakra/comicreader/* chika-reader/src/main/java/com/chakra/comicreader/ || true
        
        # 4. Pull ALL Shared Common Math & Logic Engines recursively
        cp -r chika-src/shared/src/commonMain/kotlin/com/chakra/comicreader/* chika-reader/src/main/java/com/chakra/comicreader/ || true

    - name: Create Chika Reader Module Build Configurations
      run: |
        cat << 'EOF' > chika-reader/build.gradle
        plugins {
            id 'com.android.library'
            id 'org.jetbrains.kotlin.plugin.compose'
        }

        android {
            namespace 'com.chakra.comicreader'
            compileSdk 34

            defaultConfig {
                minSdk 26
                consumerProguardFiles "consumer-rules.pro"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            buildFeatures {
                compose true
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            
            // Jetpack Compose Architecture
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.ui:ui-tooling-preview'
            implementation 'androidx.compose.material3:material3'
            
            // Material Extended Icons used by Chika UI
            implementation 'androidx.compose.material:material-icons-extended'
            
            // On-device machine learning processing
            implementation 'org.tensorflow:tensorflow-lite:2.14.0'
            implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
        }
        EOF

    - name: Inject Chika Reader Activity Wrapper
      run: |
        # Creates a traditional Android Activity entry bridge that cleanly matches Chika's inner parameters
        cat << 'EOF' > chika-reader/src/main/java/com/chakra/comicreader/ui/reader/ChikaReaderActivity.kt
        package com.chakra.comicreader.ui.reader

        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.lifecycle.viewmodel.compose.viewModel
        import com.chakra.comicreader.ui.theme.ChikaTheme

        class ChikaReaderActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val chapterPath = intent.getStringExtra("CHAPTER_PATH") ?: ""

                setContent {
                    ChikaTheme {
                        val readerViewModel: ReaderViewModel = viewModel()
                        // Match Chika's exact constructor requirements
                        ReaderScreen(
                            viewModel = readerViewModel,
                            onBack = { finish() }
                        )
                    }
                }
            }
        }
        EOF

    - name: Inject Chika Module and Register Android Manifest
      run: |
        # 1. Append module using clean strings
        echo "include ':chika-reader'" >> settings.gradle
        
        # 2. Add dependency hook to DropSauce app architecture
        sed -i '/dependencies {/a \    implementation project(":chika-reader")' app/build.gradle

        # 3. Clean injection matching the exact closing application block using pipe dividers to avoid clash
        TARGET_MANIFEST="app/src/main/AndroidManifest.xml"
        if [ -f "$TARGET_MANIFEST" ]; then
          CHIKA_ACTIVITY_XML='        <activity android:name="com.chakra.comicreader.ui.reader.ChikaReaderActivity" android:exported="false" android:theme="@style/Theme.AppCompat.NoActionBar" />\n    </application>'
          sed -i "s|</application>|$CHIKA_ACTIVITY_XML|g" "$TARGET_MANIFEST"
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Dynamically Generate Cloud Keystore
      run: |
        keytool -genkey -v \
          -keystore release.keystore \
          -alias dropchika-key \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "${{ secrets.APP_SIGNING_PASSPHRASE }}" \
          -keypass "${{ secrets.APP_SIGNING_PASSPHRASE }}" \
          -dname "CN=DropChika, O=Android, C=US"
          
        echo "KEYSTORE_BASE64=$(base64 -w 0 release.keystore)" >> $GITHUB_ENV

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Android Release Production APK
      run: ./gradlew :app:assembleRelease

    - name: Sign Android Release APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ env.KEYSTORE_BASE64 }}
        alias: dropchika-key
        keyStorePassword: ${{ secrets.APP_SIGNING_PASSPHRASE }}
        keyPassword: ${{ secrets.APP_SIGNING_PASSPHRASE }}

    - name: Upload Production Updateable APK
      uses: actions/upload-artifact@v4
      with:
        name: Combined-Release-Signed-APK
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        
